[project]
name = "feishu-dify-gateway"
version = "0.1.0"
description = "Private Feishu bot gateway for Dify conversations and infrastructure notifications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "lark-channel-sdk==1.4.0",
  "lark-oapi>=1.4,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "opentelemetry-instrumentation-httpx>=0.51b0,<1",
  "opentelemetry-sdk>=1.30,<2",
  "prometheus-client>=0.22,<1",
  "pydantic>=2.11,<3",
  "pypdf>=6.16.1,<7",
  "python-docx>=1.1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.100,<7",
  "mypy>=1.17,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
feishu-autodev-bridge = "feishu_dify_gateway.autodev:main"

[tool.hatch.build.targets.wheel]
packages = ["src/feishu_dify_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["：", "，", "；"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["feishu_dify_gateway"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# Ratchet: baseline measured at the gate's introduction. Raise, never lower.
fail_under = 73
show_missing = true
