services:
  feishu-gateway:
    build:
      context: .
    image: feishu-gateway:0.1.0
    pull_policy: build
    container_name: feishu-gateway
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:18082:8083"
      - "127.0.0.1:18084:8082"
    environment:
      GATEWAY_SECRETS_DIR: /run/secrets
      GATEWAY_STATE_DB: /var/lib/feishu-gateway/state.db
      GATEWAY_PUBLIC_PORT: "8083"
      PROMETHEUS_BASE_URL: http://prometheus:9090
      CONTROL_PLANE_BASE_URL: http://host.docker.internal:18083
      ADMINISTRATIVE_INGRESS_BASE_URL: "${ADMINISTRATIVE_INGRESS_BASE_URL:-}"
      ADMINISTRATIVE_INGRESS_SHARED_SECRET_FILE: "${ADMINISTRATIVE_INGRESS_SHARED_SECRET_FILE:-/run/secrets/administrative_ingress_shared_secret}"
      ADMINISTRATIVE_ROUTE_PREFIX: "${ADMINISTRATIVE_ROUTE_PREFIX:-/admin}"
      FEISHU_WS_ENABLED: "true"
      # Tracing is opt-in: without this endpoint the gateway runs uninstrumented.
      # Reach the collector by service name on shared-net. The collector's OTLP
      # ports are published on loopback only, so host.docker.internal cannot be
      # used from inside a container.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
      OTEL_SERVICE_NAME: "feishu-gateway"
    volumes:
      - feishu_secrets:/run/secrets:ro
      - feishu_gateway_data:/var/lib/feishu-gateway
    networks:
      - shared-net
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          raise SystemExit(0 if urllib.request.urlopen('http://127.0.0.1:8082/healthz', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  shared-net:
    external: true

volumes:
  feishu_gateway_data:
    name: feishu-gateway_feishu_gateway_data
  feishu_secrets:
    external: true
